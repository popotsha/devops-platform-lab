server {
    listen 80;
    server_name localhost;

    # Keycloak (and other apps) set cookies on the shared `localhost` host.
    # Safari/Chrome send those cookies to :4200 as well, which exceeds nginx defaults
    # and yields "400 Request Header Or Cookie Too Large".
    client_header_buffer_size 32k;
    large_client_header_buffers 8 64k;
    client_body_buffer_size 128k;

    # Hashed JS/CSS/font assets — cache forever (hash changes when content changes)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
        root /usr/share/nginx/html/browser;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html and env.js — never cache so the browser always gets the latest build
    location ~* \.(html|json)$ {
        root /usr/share/nginx/html/browser;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location = /env.js {
        root /usr/share/nginx/html/browser;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        root /usr/share/nginx/html/browser;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
